name: Developer Pre-Release

on:
  push:
    branches:
      - developer

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: [self-hosted, windows, x64]

    env:
      QT6_DIR: C:\Qt\6.8.3\msvc2022_64
      MUPDF_ROOT: D:\Aplicaciones\mupdf

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: cmake --preset release-msvc

      - name: Stop running PDFClowne
        shell: pwsh
        run: |
          Get-Process PDFClowne -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Build
        shell: pwsh
        run: cmake --build --preset release-msvc

      - name: Package release folder
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          $zipPath = Join-Path $packageDir "PDFClowne-developer-${{ github.run_number }}.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "build\release\*" -DestinationPath $zipPath

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: developer-build-${{ github.run_number }}
          name: PDFClowne Developer Build #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/PDFClowne-developer-${{ github.run_number }}.zip
